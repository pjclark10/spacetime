<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Dashed Yellow Light Cones -->
  <g stroke="#eab308" stroke-width="4" stroke-dasharray="10 6" opacity="0.65" filter="url(#glow)">
    <line x1="80" y1="80" x2="432" y2="432" />
    <line x1="80" y1="432" x2="432" y2="80" />
  </g>

  <!-- Subtle Boosted Grid Lines (Skewed S' frame reference) -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.5">
    <line x1="130" y1="400" x2="382" y2="112" />
    <line x1="180" y1="448" x2="432" y2="160" />
    <line x1="80" y1="352" x2="332" y2="64" />
  </g>

  <!-- Boosted Frame S' Axes -->
  <!-- ct' axis (Cyan) -->
  <line x1="200" y1="460" x2="312" y2="52" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <!-- x' axis (Violet) -->
  <line x1="52" y1="312" x2="460" y2="200" stroke="url(#violetGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Origin / Event Point -->
  <circle cx="256" cy="256" r="10" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="256" cy="256" r="4" fill="#ffffff" />
</svg>
