<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#090d16"/>
  
  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4">
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="256" y1="64" x2="256" y2="448" />
  </g>

  <!-- Yellow Light Cones -->
  <g stroke="#eab308" stroke-width="4" stroke-dasharray="8,8" opacity="0.85">
    <line x1="96" y1="416" x2="416" y2="96" />
    <line x1="96" y1="96" x2="416" y2="416" />
  </g>

  <!-- Lab Axes (ct, x) -->
  <g stroke="#64748b" stroke-width="3" opacity="0.6">
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="256" y1="64" x2="256" y2="448" />
  </g>

  <!-- Cyan Boosted ct' Axis -->
  <line x1="166" y1="416" x2="346" y2="96" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>

  <!-- Violet Boosted x' Axis -->
  <line x1="96" y1="346" x2="416" y2="166" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>

  <!-- Magenta Accelerated Worldline (Rindler Hyperbola) -->
  <path d="M 430 400 Q 310 256 430 112" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>

  <!-- Event Horizon (Dashed Magenta) -->
  <line x1="140" y1="416" x2="380" y2="96" stroke="#ec4899" stroke-width="3" stroke-dasharray="6,6" opacity="0.7"/>

  <!-- Event Origin / Event Marker Dot -->
  <circle cx="256" cy="256" r="8" fill="#38bdf8"/>
  <circle cx="346" cy="256" r="7" fill="#f43f5e"/>
</svg>
