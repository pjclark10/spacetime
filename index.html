<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minkowski Spacetime Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0B0F19', 800: '#111827', 700: '#1F2937', 600: '#374151' },
                        velocityColor: { 500: '#06b6d4', 400: '#22d3ee' },
                        accelColor: { 500: '#f97316', 400: '#fb923c' },
                        horizonColor: { 500: '#ec4899', 400: '#f472b6' },
                        spaceAxisColor: { 500: '#8b5cf6', 400: '#a78bfa' },
                        lightConeColor: { 500: '#eab308', 400: '#facc15' }
                    }
                }
            }
        }
    </script>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, startup: { typeset: true } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        input[type="range"] { touch-action: pan-x; }
    </style>
</head>
<body class="bg-dark-900 text-gray-100 h-[100dvh] flex flex-col overflow-hidden antialiased select-none">

    <!-- Compact Header -->
    <header class="bg-dark-800/95 border-b border-gray-800 shrink-0 h-12 flex items-center px-3 justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-velocityColor-500 to-accelColor-500 flex items-center justify-center">
                <svg class="w-4 h-4 text-dark-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <h1 class="font-bold text-xs sm:text-sm tracking-tight bg-gradient-to-r from-velocityColor-400 to-lightConeColor-400 bg-clip-text text-transparent">Minkowski Spacetime Simulator</h1>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-[10px] font-mono bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded border border-cyan-500/20">c = 1</span>
        </div>
    </header>

    <!-- Main No-Scroll Workspace -->
    <main class="flex-1 flex flex-col p-2 gap-2 max-w-7xl mx-auto w-full overflow-hidden">
        
        <!-- Dual Canvases (Side-by-Side even on mobile for simultaneous viewing) -->
        <section class="grid grid-cols-2 gap-2 flex-1 min-h-0">
            
            <!-- Canvas 1: Lab Frame S -->
            <div class="bg-dark-800 rounded-xl p-2 border border-gray-800 flex flex-col shadow-md relative overflow-hidden">
                <div class="flex items-center justify-between pb-1 mb-1 border-b border-gray-700/50">
                    <span class="font-semibold text-[11px] sm:text-xs text-gray-200 flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full bg-lightConeColor-500 inline-block"></span>
                        <span>Lab Frame ($S$)</span>
                    </span>
                    <span class="text-[9px] font-mono text-gray-400">Event Horizon</span>
                </div>
                <div class="relative flex-1 w-full bg-dark-900 rounded-lg overflow-hidden flex items-center justify-center">
                    <canvas id="minkowskiCanvas1" class="w-full h-full cursor-crosshair"></canvas>
                    <div class="absolute bottom-1 left-1 bg-dark-900/90 backdrop-blur px-1.5 py-0.5 rounded border border-gray-700/80 text-[8px] sm:text-[10px] font-mono text-gray-300 flex items-center space-x-1 shadow">
                        <span class="w-1.5 h-1.5 rounded-full bg-horizonColor-500 shrink-0"></span>
                        <span>$x = ct - \rho$</span>
                    </div>
                </div>
            </div>

            <!-- Canvas 2: Boosted Frame S' -->
            <div class="bg-dark-800 rounded-xl p-2 border border-gray-800 flex flex-col shadow-md relative overflow-hidden">
                <div class="flex items-center justify-between pb-1 mb-1 border-b border-gray-700/50">
                    <span class="font-semibold text-[11px] sm:text-xs text-gray-200 flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full bg-spaceAxisColor-500 inline-block"></span>
                        <span>Boosted Frame ($S'$)</span>
                    </span>
                    <span class="text-[9px] font-mono text-gray-400">Skewed Axes</span>
                </div>
                <div class="relative flex-1 w-full bg-dark-900 rounded-lg overflow-hidden flex items-center justify-center">
                    <canvas id="minkowskiCanvas2" class="w-full h-full cursor-crosshair"></canvas>
                    <div class="absolute bottom-1 left-1 bg-dark-900/90 backdrop-blur px-1.5 py-0.5 rounded border border-gray-700/80 text-[8px] sm:text-[10px] font-mono text-gray-300 flex items-center space-x-1 shadow">
                        <span class="w-1.5 h-1.5 rounded-full bg-velocityColor-400 shrink-0"></span>
                        <span><strong class="text-velocityColor-400">ct'</strong> matches vel</span>
                    </div>
                </div>
            </div>

        </section>

        <!-- Compact Controls & Telemetry Dashboard (Fixed fit below canvases) -->
        <section class="shrink-0 bg-dark-800 rounded-xl p-2.5 sm:p-3 border border-gray-800 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
            
            <!-- Sliders Panel -->
            <div class="space-y-2">
                <!-- Velocity Slider -->
                <div class="space-y-0.5 bg-dark-700/30 p-1.5 rounded-lg border border-gray-700/40">
                    <div class="flex items-center justify-between text-[11px]">
                        <label for="beta-slider" class="text-gray-300 font-medium">Velocity ($\beta = v/c$)</label>
                        <span id="beta-val" class="font-mono text-velocityColor-400 font-bold bg-dark-900 px-1.5 py-0.5 rounded border border-gray-700">0.60</span>
                    </div>
                    <input id="beta-slider" type="range" min="-0.99" max="0.99" step="0.01" value="0.60" oninput="updateSimulation()"
                           class="w-full accent-cyan-500 bg-dark-700 h-2 rounded cursor-pointer">
                </div>

                <!-- Proper Acceleration Slider -->
                <div class="space-y-0.5 bg-dark-700/30 p-1.5 rounded-lg border border-gray-700/40">
                    <div class="flex items-center justify-between text-[11px]">
                        <label for="accel-slider" class="text-gray-300 font-medium">Proper Accel ($g$)</label>
                        <span id="accel-val" class="font-mono text-accelColor-400 font-bold bg-dark-900 px-1.5 py-0.5 rounded border border-gray-700">1.00</span>
                    </div>
                    <input id="accel-slider" type="range" min="0.1" max="3.0" step="0.05" value="1.0" oninput="updateSimulation()"
                           class="w-full accent-orange-500 bg-dark-700 h-2 rounded cursor-pointer">
                </div>

                <!-- Time Parameter Slider -->
                <div class="space-y-0.5 bg-dark-700/30 p-1.5 rounded-lg border border-gray-700/40">
                    <div class="flex items-center justify-between text-[11px]">
                        <label for="time-slider" class="text-gray-300 font-medium">Time Parameter ($t$)</label>
                        <span id="time-val" class="font-mono text-purple-400 font-bold bg-dark-900 px-1.5 py-0.5 rounded border border-gray-700">1.50</span>
                    </div>
                    <input id="time-slider" type="range" min="-5.0" max="5.0" step="0.1" value="1.5" oninput="updateSimulation()"
                           class="w-full accent-purple-500 bg-dark-700 h-2 rounded cursor-pointer">
                </div>
            </div>

            <!-- Telemetry Panel -->
            <div class="space-y-1.5 flex flex-col justify-between font-mono text-[11px]">
                <div class="grid grid-cols-2 gap-1.5">
                    <div class="bg-dark-700/40 p-2 rounded-lg border border-gray-700/40 flex flex-col justify-between">
                        <span class="text-gray-400 text-[10px]">Lorentz ($\gamma$):</span>
                        <span id="telemetry-gamma" class="text-velocityColor-400 font-bold text-xs">1.250</span>
                    </div>
                    <div class="bg-dark-700/40 p-2 rounded-lg border border-gray-700/40 flex flex-col justify-between">
                        <span class="text-gray-400 text-[10px]">Orthog ($U \cdot A$):</span>
                        <span id="telemetry-dot" class="text-emerald-400 font-bold text-xs">0.0000</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <div class="bg-dark-700/40 p-1.5 rounded-lg border border-gray-700/40 flex items-center justify-between">
                        <span class="text-gray-400 text-[10px]">$U^\mu$:</span>
                        <span id="telemetry-u" class="text-gray-200">(1.25, 0.75)</span>
                    </div>
                    <div class="bg-dark-700/40 p-1.5 rounded-lg border border-gray-700/40 flex items-center justify-between">
                        <span class="text-gray-400 text-[10px]">$A^\mu$:</span>
                        <span id="telemetry-a" class="text-accelColor-400">(1.56, 2.08)</span>
                    </div>
                </div>
                <!-- Quick Presets -->
                <div class="grid grid-cols-3 gap-1 pt-0.5">
                    <button onclick="setPreset(-0.6, 0.5, 1.0)" class="py-1 px-1 bg-dark-700 hover:bg-dark-600 rounded border border-gray-700 text-[10px] active:scale-95">\(\beta=-0.6\)</button>
                    <button onclick="setPreset(0.0, 1.0, 1.5)" class="py-1 px-1 bg-dark-700 hover:bg-dark-600 rounded border border-gray-700 text-[10px] active:scale-95">\(\beta=0\)</button>
                    <button onclick="setPreset(0.7, 1.0, 1.5)" class="py-1 px-1 bg-dark-700 hover:bg-dark-600 rounded border border-gray-700 text-[10px] active:scale-95">\(\beta=0.7\)</button>
                </div>
            </div>

        </section>

    </main>

    <script>
        let betaInertial = 0.6;
        let accel = 1.0;
        let timeParam = 1.5;

        function setPreset(bVal, gVal, tVal) {
            betaInertial = bVal;
            accel = gVal;
            timeParam = tVal;
            document.getElementById('beta-slider').value = betaInertial;
            document.getElementById('accel-slider').value = accel;
            document.getElementById('time-slider').value = timeParam;
            updateSimulation();
        }

        function updateSimulation() {
            betaInertial = parseFloat(document.getElementById('beta-slider').value);
            accel = parseFloat(document.getElementById('accel-slider').value);
            timeParam = parseFloat(document.getElementById('time-slider').value);

            document.getElementById('beta-val').innerText = betaInertial.toFixed(2);
            document.getElementById('accel-val').innerText = accel.toFixed(2);
            document.getElementById('time-val').innerText = timeParam.toFixed(2);

            const gamma = 1.0 / Math.sqrt(Math.max(0.0001, 1.0 - betaInertial * betaInertial));
            const u0 = gamma;
            const u1 = gamma * betaInertial;
            const a0 = accel > 0 ? accel * gamma * gamma * betaInertial : 0;
            const a1 = accel > 0 ? accel * gamma * gamma : 0;
            const dotProduct = -u0 * a0 + u1 * a1;

            document.getElementById('telemetry-gamma').innerText = gamma.toFixed(3);
            document.getElementById('telemetry-u').innerText = `(${u0.toFixed(2)}, ${u1.toFixed(2)})`;
            document.getElementById('telemetry-a').innerText = `(${a0.toFixed(2)}, ${a1.toFixed(2)})`;
            document.getElementById('telemetry-dot').innerText = dotProduct.toFixed(4);

            renderCanvases();
        }

        function setupCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            return { ctx, width: rect.width, height: rect.height };
        }

        function renderCanvases() {
            renderCanvas1();
            renderCanvas2();
        }

        function renderCanvas1() {
            const { ctx, width, height } = setupCanvas('minkowskiCanvas1');
            ctx.clearRect(0, 0, width, height);

            const ox = width / 2;
            const oy = height / 2;
            const scale = Math.min(width, height) / 10;

            // Grid lines
            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 1;
            for (let i = -5; i <= 5; i++) {
                ctx.beginPath(); ctx.moveTo(ox + i * scale, 0); ctx.lineTo(ox + i * scale, height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, oy - i * scale); ctx.lineTo(width, oy - i * scale); ctx.stroke();
            }

            // Light Cone
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#eab308';
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(ox - scale * 5, oy + scale * 5); ctx.lineTo(ox + scale * 5, oy - scale * 5);
            ctx.moveTo(ox - scale * 5, oy - scale * 5); ctx.lineTo(ox + scale * 5, oy + scale * 5);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Lab Axes
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(ox, height); ctx.lineTo(ox, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(width, oy); ctx.stroke();

            // Event Horizon: x = ct - rho where rho = 1/g
            ctx.strokeStyle = '#ec4899';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            const rho = 1.0 / accel;
            const horizonOffset = scale * rho;
            ctx.moveTo(0, oy + ox - horizonOffset);
            ctx.lineTo(width, oy + ox - width - horizonOffset);
            ctx.stroke();
            ctx.setLineDash([]);

            // Uniform Velocity Path
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            let firstBeta = true;
            for (let t = -5; t <= 5; t += 0.05) {
                const px = ox + (betaInertial * t) * scale;
                const py = oy - t * scale;
                if (firstBeta) { ctx.moveTo(px, py); firstBeta = false; } else { ctx.lineTo(px, py); }
            }
            ctx.stroke();

            const currTPx = ox + (betaInertial * timeParam) * scale;
            const currTPy = oy - timeParam * scale;
            ctx.fillStyle = '#22d3ee';
            ctx.beginPath(); ctx.arc(currTPx, currTPy, 4, 0, 2 * Math.PI); ctx.fill();

            // Accelerated Path
            let hypPx = ox, hypPy = oy;
            if (accel > 0) {
                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                let firstHyp = true;
                for (let t = -5; t <= 5; t += 0.02) {
                    const sign = t >= 0 ? 1 : -1;
                    const tAbs = Math.abs(t);
                    const xHyp = sign * (1.0 / accel) * (Math.sqrt(1.0 + accel * accel * tAbs * tAbs) - 1.0);
                    const px = ox + xHyp * scale;
                    const py = oy - t * scale;
                    if (firstHyp) { ctx.moveTo(px, py); firstHyp = false; } else { ctx.lineTo(px, py); }
                }
                ctx.stroke();

                const signT = timeParam >= 0 ? 1 : -1;
                const currXHyp = signT * (1.0 / accel) * (Math.sqrt(1.0 + accel * accel * Math.abs(timeParam) * Math.abs(timeParam)) - 1.0);
                hypPx = ox + currXHyp * scale;
                hypPy = oy - timeParam * scale;
                ctx.fillStyle = '#fb923c';
                ctx.beginPath(); ctx.arc(hypPx, hypPy, 4, 0, 2 * Math.PI); ctx.fill();
            }

            // Labels
            ctx.font = '9px JetBrains Mono, monospace';
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(currTPx + 4, currTPy - 12, 75, 14);
            ctx.strokeStyle = '#06b6d4';
            ctx.strokeRect(currTPx + 4, currTPy - 12, 75, 14);
            ctx.fillStyle = '#22d3ee';
            ctx.fillText(`v = ${betaInertial.toFixed(2)}`, currTPx + 7, currTPy - 2);

            if (accel > 0) {
                ctx.fillStyle = '#0b0f19';
                ctx.fillRect(hypPx + 4, hypPy + 4, 75, 14);
                ctx.strokeStyle = '#f97316';
                ctx.strokeRect(hypPx + 4, hypPy + 4, 75, 14);
                ctx.fillStyle = '#fb923c';
                ctx.fillText(`g = ${accel.toFixed(2)}`, hypPx + 7, hypPy + 14);
            }
        }

        function renderCanvas2() {
            const { ctx, width, height } = setupCanvas('minkowskiCanvas2');
            ctx.clearRect(0, 0, width, height);

            const ox = width / 2;
            const oy = height / 2;
            const scale = Math.min(width, height) / 10;

            // Light Cone
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#eab308';
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(ox - scale * 5, oy + scale * 5); ctx.lineTo(ox + scale * 5, oy - scale * 5);
            ctx.moveTo(ox - scale * 5, oy - scale * 5); ctx.lineTo(ox + scale * 5, oy + scale * 5);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Neutral Lab Reference Axes
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;
            ctx.setLineDash([2, 2]);
            ctx.beginPath(); ctx.moveTo(ox, height); ctx.lineTo(ox, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(width, oy); ctx.stroke();
            ctx.setLineDash([]);

            const gamma = 1.0 / Math.sqrt(Math.max(0.0001, 1.0 - betaInertial * betaInertial));

            // ct' axis (Cyan matching velocity worldline)
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            let firstCt = true;
            for (let ctp = -5; ctp <= 5; ctp += 0.1) {
                const ct = gamma * ctp;
                const x = gamma * betaInertial * ctp;
                const px = ox + x * scale;
                const py = oy - ct * scale;
                if (firstCt) { ctx.moveTo(px, py); firstCt = false; } else { ctx.lineTo(px, py); }
            }
            ctx.stroke();

            // x' axis (Violet)
            ctx.strokeStyle = '#8b5cf6';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            let firstX = true;
            for (let xp = -5; xp <= 5; xp += 0.1) {
                const ct = gamma * betaInertial * xp;
                const x = gamma * xp;
                const px = ox + x * scale;
                const py = oy - ct * scale;
                if (firstX) { ctx.moveTo(px, py); firstX = false; } else { ctx.lineTo(px, py); }
            }
            ctx.stroke();

            // Clamped Axis Labels
            ctx.font = '9px JetBrains Mono, monospace';
            const topCt = gamma * 4.2;
            const topX = gamma * betaInertial * 4.2;
            let ctX = Math.max(4, Math.min(width - 45, ox + topX * scale + 4));
            let ctY = Math.max(12, Math.min(height - 10, oy - topCt * scale));

            ctx.fillStyle = '#0b0f19'; ctx.fillRect(ctX, ctY - 10, 42, 14);
            ctx.strokeStyle = '#06b6d4'; ctx.strokeRect(ctX, ctY - 10, 42, 14);
            ctx.fillStyle = '#22d3ee'; ctx.fillText("ct' axis", ctX + 3, ctY);

            const rightCt = gamma * betaInertial * 4.2;
            const rightX = gamma * 4.2;
            let xX = Math.max(4, Math.min(width - 40, ox + rightX * scale + 4));
            let xY = Math.max(12, Math.min(height - 10, oy - rightCt * scale));

            ctx.fillStyle = '#0b0f19'; ctx.fillRect(xX, xY - 10, 38, 14);
            ctx.strokeStyle = '#8b5cf6'; ctx.strokeRect(xX, xY - 10, 38, 14);
            ctx.fillStyle = '#c084fc'; ctx.fillText("x' axis", xX + 3, xY);
        }

        window.onload = function() {
            updateSimulation();
            window.addEventListener('resize', renderCanvases);
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
            }
        };
    </script>
</body>
</html>
