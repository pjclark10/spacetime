<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spacetime & Curved Geometry Suite</title>
    <style>
        /* Base Reset & Mobile-First Interface Rules */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #111111; 
            color: #ffffff; 
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Top Mobile Dashboard Tab Switcher Header */
        #app-header {
            display: flex;
            background: #161616;
            border-bottom: 1px solid #2d2d2d;
            height: 50px;
            z-index: 1000;
            position: relative;
        }
        .tab-button {
            flex: 1;
            background: none;
            border: none;
            color: #888888;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s, background-color 0.2s;
            text-align: center;
            line-height: 50px;
        }
        .tab-button.active {
            color: #ffffff;
            background-color: #1e1e1e;
            border-bottom: 3px solid #007bff;
            font-weight: 600;
        }

        /* Isolated Module Viewports */
        .module-viewport {
            display: none;
            width: 100vw;
            height: calc(100vh - 50px);
            position: relative;
            overflow: hidden;
        }
        .module-viewport.active {
            display: block;
        }

        /* Safe Multi-Window Sandbox Layer */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #111111;
        }

        /* Spherical Geometry Viewport Container */
        #spherical-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }
        #canvas3d {
            flex: 1;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* On-Screen HUD Control Panels */
        .hud-panel {
            position: absolute;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 10;
            max-width: 90vw;
        }
        #math-hud { top: 10px; left: 10px; width: 280px; }
        #control-hud { bottom: 150px; right: 10px; width: 240px; }
        #graph-hud {
            bottom: 10px; left: 10px; right: 10px; height: 130px;
            display: flex; flex-direction: column;
        }

        /* Typography & Parametric Sliders Layout */
        h4 { margin-bottom: 6px; color: #007bff; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .math-line { margin: 4px 0; font-family: "Courier New", monospace; font-size: 12px; display: flex; justify-content: space-between; }
        .formula-box { background: rgba(0,0,0,0.3); padding: 6px; border-radius: 4px; margin-top: 6px; border-left: 3px solid #ffc107; font-size: 11px; }
        .control-group { margin: 8px 0; display: flex; flex-direction: column; }
        .control-group label { margin-bottom: 3px; color: #aaa; font-size: 11px; }
        input[type="range"] { flex: 1; accent-color: #007bff; cursor: pointer; }
        .preset-row { display: flex; gap: 4px; margin-top: 6px; }
        .btn { flex: 1; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 6px; font-size: 11px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #3a3a3a; border-color: #007bff; }
        #plotCanvas { background: #151515; border-radius: 4px; flex: 1; width: 100%; height: 100px; }
    </style>
    <!-- Robust Production CDN Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- Tabbed Navigation Bar Header -->
    <div id="app-header">
        <button class="tab-button active" onclick="activateTab('minkowski-tab')">Minkowski Spacetime (SR)</button>
        <button class="tab-button" onclick="activateTab('spherical-tab')">Curved Geometry (GR)</button>
    </div>

    <!-- MODULE 1: MINKOWSKI SPACETIME SIMULATOR (LOADS YOUR CODE VIA AN ISOLATED IFRAME) -->
    <div id="minkowski-tab" class="module-viewport active">
        <iframe src="minkowski.html" id="minkowski-frame"></iframe>
    </div>

    <!-- MODULE 2: SPHERICAL TRIANGLE NON-EUCLIDEAN CURVED GEOMETRY -->
    <div id="spherical-tab" class="module-viewport">
        <div id="spherical-container">
            <canvas id="canvas3d"></canvas>
            
            <!-- Mathematical Metric Telemetry Panel -->
            <div id="math-hud" class="hud-panel">
                <h4>Spherical Area Excess</h4>
                <div class="math-line"><span>Angle Sum (Σα):</span><span id="val-sum">270.0°</span></div>
                <div class="math-line"><span>Excess (E):</span><span id="val-excess">90.0°</span></div>
                <div class="math-line"><span>Triangle Area:</span><span id="val-area">1.571 steradians</span></div>
                <div class="math-line"><span>Sphere Covered:</span><span id="val-ratio">1/8 [12.5%]</span></div>
                <div class="formula-box">
                    <strong>Intrinsic Geometry Law:</strong><br>
                    Excess E = (α + β + γ) - 180°<br>
                    Area A = E × R² steradians
                </div>
            </div>

            <!-- Configuration Adjustment Panel Controls -->
            <div id="control-hud" class="hud-panel">
                <h4>Controls</h4>
                <div class="control-group">
                    <label>Triangle Dimension Size (Angle Sum)</label>
                    <input type="range" id="size-slider" min="181" max="890" value="270">
                </div>
                <div class="control-group">
                    <label>Sphere Translucency (Opacity)</label>
                    <input type="range" id="opacity-slider" min="0" max="100" value="30">
                </div>
                <div class="control-group">
                    <label>Grid Line Intensity</label>
                    <input type="range" id="grid-slider" min="10" max="100" value="60">
                </div>
                <div class="preset-row">
                    <button class="btn" onclick="setPreset(195)">180°</button>
                    <button class="btn" onclick="setPreset(270)">270°</button>
                    <button class="btn" onclick="setPreset(360)">360°</button>
                    <button class="btn" onclick="setPreset(720)">720°</button>
                </div>
            </div>

            <!-- Mathematical Curve Tracking Overlay -->
            <div id="graph-hud" class="hud-panel">
                <h4 style="margin-bottom: 2px;">Area Excess Profile (Steradians vs Angle Sum)</h4>
                <canvas id="plotCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- Service Worker Hook Injection ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        // --- Navigation Frame Switching State Engine ---
        function activateTab(targetTabId) {
            document.querySelectorAll('.module-viewport').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(targetTabId).classList.add('active');
            if (window.event && window.event.currentTarget) {
                window.event.currentTarget.classList.add('active');
            }
            
            // Force WebGL Canvas view resizing update loops upon tab selection switches
            window.dispatchEvent(new Event('resize'));
        }

        // --- 3D Graphics Engine Variables & Configurations ---
        let scene, camera, renderer, controls, sphereMesh, gridChildFront, gridChildBack, triangleLines, angleMarkerGroup;
        const SPHERE_RADIUS = 1.6;
        const canvas3d = document.getElementById('canvas3d');

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, canvas3d.clientWidth / canvas3d.clientHeight, 0.1, 100);
            camera.position.set(2.5, 2.0, 3.5);

            renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true, alpha: true });
            renderer.setSize(canvas3d.clientWidth, canvas3d.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05; 
            controls.rotateSpeed = -0.6; // Inverted for intuitive direct globe surface rotation tracking

            const ambient = new THREE.AmbientLight(0xffffff, 0.4); scene.add(ambient);
            const dir1 = new THREE.DirectionalLight(0xffffff, 0.8); dir1.position.set(5, 5, 5); scene.add(dir1);

            // Core Translucent Surface Geometry Mesh Base Shell
            const sphereGeo = new THREE.SphereGeometry(SPHERE_RADIUS, 32, 32);
            const sphereMat = new THREE.MeshStandardMaterial({ color: 0x112244, roughness: 0.4, metalness: 0.1, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
            sphereMesh = new THREE.Mesh(sphereGeo, sphereMat); scene.add(sphereMesh);
            // Bolder, Sharp Double-Sided Coordinate Grids
            const gridGeo = new THREE.SphereGeometry(SPHERE_RADIUS - 0.002, 24, 12);
            gridChildBack = new THREE.Mesh(gridGeo, new THREE.MeshBasicMaterial({ color: 0xaaaaaa, wireframe: true, transparent: true, opacity: 0.15, side: THREE.BackSide })); scene.add(gridChildBack);
            gridChildFront = new THREE.Mesh(gridGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.35, side: THREE.FrontSide })); scene.add(gridChildFront);
            // Intrinsic Elements Mapping Tracks
            triangleLines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xff3b30, linewidth: 3 })); scene.add(triangleLines);
            angleMarkerGroup = new THREE.Group(); scene.add(angleMarkerGroup);
            document.getElementById('size-slider').addEventListener('input', updateGeometry);
            document.getElementById('opacity-slider').addEventListener('input', updateMaterials);
            document.getElementById('grid-slider').addEventListener('input', updateMaterials);
            updateGeometry(); animate();
            }
            // --- Geometric Path Tracing Functions ---
            function getGreatCircleArc(v1, v2) {
            const points = []; const count = 60;
            for (let i = 0; i <= count; i++) {
            points.push(new THREE.Vector3().copy(v1).slerp(v2, i / count).normalize().multiplyScalar(SPHERE_RADIUS + 0.005));
            }
            return points;
            }
            function createCurvedArcPoints(vCenter, vA, vB, arcRadius) {
            const tA = new THREE.Vector3().copy(vA).projectOnPlane(vCenter).normalize();
            const tB = new THREE.Vector3().copy(vB).projectOnPlane(vCenter).normalize();
            const points = []; const count = 30;
            for(let i=0; i<=count; i++) {
            const pLocal = new THREE.Vector3().copy(tA).slerp(tB, i / count).normalize().multiplyScalar(arcRadius);
            points.push(new THREE.Vector3().copy(vCenter).multiplyScalar(Math.sqrt(SPHERE_RADIUS2 - arcRadius2)).add(pLocal));
            }
            return points;
            }
            function createSquareCornerPoints(vCenter, vA, vB, size = 0.15) {
            const tA = new THREE.Vector3().copy(vA).projectOnPlane(vCenter).normalize().multiplyScalar(size);
            const tB = new THREE.Vector3().copy(vB).projectOnPlane(vCenter).normalize().multiplyScalar(size);
            const pt1 = new THREE.Vector3().copy(vCenter).multiplyScalar(SPHERE_RADIUS).add(tA).normalize().multiplyScalar(SPHERE_RADIUS + 0.008);
            const pt2 = new THREE.Vector3().copy(vCenter).multiplyScalar(SPHERE_RADIUS).add(tA).add(tB).normalize().multiplyScalar(SPHERE_RADIUS + 0.008);
            const pt3 = new THREE.Vector3().copy(vCenter).multiplyScalar(SPHERE_RADIUS).add(tB).normalize().multiplyScalar(SPHERE_RADIUS + 0.008);
            return [pt1, pt2, pt2, pt3];
            }
            // --- Core Intrinsic Mathematics Equations Update Engine ---
            function updateGeometry() {
            const totalSum = parseFloat(document.getElementById('size-slider').value);
            const excessDeg = totalSum - 180.0; const excessRad = (excessDeg * Math.PI) / 180.0;
            const singleAngleRad = ((totalSum / 3.0) * Math.PI) / 180.0;
            const sideAlpha = Math.acos(Math.max(-1, Math.min(1, (Math.cos(singleAngleRad) + Math.cos(singleAngleRad)**2) / Math.sin(singleAngleRad)**2)));
            const vA = new THREE.Vector3(0, 1, 0);
            const vB = new THREE.Vector3(Math.sin(sideAlpha), Math.cos(sideAlpha), 0);
            const vC = new THREE.Vector3(Math.sin(sideAlpha) * Math.cos(120Math.PI/180), Math.cos(sideAlpha), Math.sin(sideAlpha) * Math.sin(120Math.PI/180));
            let arcAB = getGreatCircleArc(vA, vB); let arcBC = getGreatCircleArc(vB, vC); let arcCA = getGreatCircleArc(vC, vA);
            const linePoints = [];
            for (let i = 0; i < arcAB.length - 1; i++) linePoints.push(arcAB[i], arcAB[i+1]);
            for (let i = 0; i < arcBC.length - 1; i++) linePoints.push(arcBC[i], arcBC[i+1]);
            for (let i = 0; i < arcCA.length - 1; i++) linePoints.push(arcCA[i], arcCA[i+1]);
            triangleLines.geometry.setFromPoints(linePoints);
            while(angleMarkerGroup.children.length > 0) angleMarkerGroup.remove(angleMarkerGroup.children[0]);
            const vertices = [{ center: vA, left: vB, right: vC }, { center: vB, left: vC, right: vA }, { center: vC, left: vA, right: vB }];
            const markerColor = (totalSum > 540) ? 0x28a745 : 0xffc107;
            const markerMat = new THREE.LineBasicMaterial({ color: markerColor, linewidth: 2.5, depthWrite: false });
            vertices.forEach(v => {
            let pts = [];
            if (Math.abs(totalSum - 270.0) < 1.0) pts = createSquareCornerPoints(v.center, v.left, v.right, 0.2);
            else pts = createCurvedArcPoints(v.center, totalSum > 540 ? v.right : v.left, totalSum > 540 ? v.left : v.right, 0.2);
            const mLine = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), markerMat);
            mLine.renderOrder = 1; angleMarkerGroup.add(mLine);
            });
            document.getElementById('val-sum').innerText = totalSum.toFixed(1) + "°";
            document.getElementById('val-excess').innerText = excessDeg.toFixed(1) + "°";
            document.getElementById('val-area').innerText = ${(excessRad * SPHERE_RADIUS**2).toFixed(3)} steradians [${(excessDeg/180).toFixed(3)}π];
            let fractionStr = [${((excessDeg / 720.0) * 100).toFixed(1)}%];
            if (Math.abs(totalSum - 270.0) < 1.0) fractionStr = "1/8 [12.5%]";
            if (Math.abs(totalSum - 360.0) < 1.0) fractionStr = "1/4 [25.0%]";
            if (Math.abs(totalSum - 540.0) < 1.0) fractionStr = "1/2 [50.0%]";
            document.getElementById('val-ratio').innerText = fractionStr;
            drawGraph(totalSum);
            }
            function updateMaterials() {
            sphereMesh.material.opacity = parseFloat(document.getElementById('opacity-slider').value) / 100.0;
            gridChildFront.material.opacity = (parseFloat(document.getElementById('grid-slider').value) / 100.0) * 0.6;
            gridChildBack.material.opacity = (parseFloat(document.getElementById('grid-slider').value) / 100.0) * 0.25;
            }
            function setPreset(val) { document.getElementById('size-slider').value = val; updateGeometry(); }
            // --- Native Canvas Graph Tracker Profile ---
            function drawGraph(activeSum) {
            const canvas = document.getElementById('plotCanvas'); const ctx = canvas.getContext('2d');
            const w = canvas.clientWidth; const h = canvas.clientHeight;
            canvas.width = w * window.devicePixelRatio; canvas.height = h * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            ctx.clearRect(0, 0, w, h);
            const padL = 40, padR = 20, padT = 15, padB = 20, graphW = w - padL - padR, graphH = h - padT - padB;
            const mapX = x => padL + ((x - 180) / 720) * graphW, mapY = y => padT + graphH - (y / (4 * Math.PI)) * graphH;
            ctx.strokeStyle = '#2d2d2d'; ctx.lineWidth = 1;
            [180, 270, 360, 540, 720, 900].forEach(tick => { ctx.beginPath(); ctx.moveTo(mapX(tick), padT); ctx.lineTo(mapX(tick), padT + graphH); ctx.stroke(); });
            ctx.beginPath(); ctx.strokeStyle = '#007bff'; ctx.lineWidth = 2;
            for(let s = 180; s <= 900; s += 5) { if(s === 180) ctx.moveTo(mapX(s), mapY(((s - 180) * Math.PI) / 180)); else ctx.lineTo(mapX(s), mapY(((s - 180) * Math.PI) / 180)); }
            ctx.stroke();
            ctx.fillStyle = '#888888'; ctx.font = '10px sans-serif'; ctx.textBaseline = 'top';
            ctx.fillText('180°', mapX(180) - 8, padT + graphH + 4); ctx.fillText('540°', mapX(540) - 10, padT + graphH + 4); ctx.fillText('900°', mapX(900) - 10, padT + graphH + 4);
            ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
            ctx.fillText('0', padL - 6, mapY(0)); ctx.fillText('2π', padL - 6, mapY(2 * Math.PI)); ctx.fillText('4π', padL - 6, mapY(4 * Math.PI));
            ctx.beginPath(); ctx.fillStyle = '#ff3b30'; ctx.arc(mapX(activeSum), mapY(((activeSum - 180) * Math.PI) / 180), 5, 0, 2 * Math.PI); ctx.fill();
            }
            // --- Continuous Render Animation Loop ---
            function animate() { requestAnimationFrame(animate); if (controls) controls.update(); if (renderer) renderer.render(scene, camera); }
            window.addEventListener('resize', () => {
            if (!canvas3d || !camera || !renderer) return;
            camera.aspect = canvas3d.clientWidth / canvas3d.clientHeight; camera.updateProjectionMatrix();
            renderer.setSize(canvas3d.clientWidth, canvas3d.clientHeight);
            drawGraph(parseFloat(document.getElementById('size-slider').value));
            });
            window.onload = () => { init3D(); updateMaterials(); };
