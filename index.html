<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minkowski Spacetime Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#111827',
                        borderCol: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spacetime">
    <style>
        body, html {
            background-color: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        input[type="range"] {
            accent-color: #38bdf8;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between p-2 md:p-4 overflow-hidden">
    
    <!-- Top Header (Compact) -->
    <header class="flex justify-between items-center px-3 py-1 bg-cardBg/80 backdrop-blur-md border border-borderCol rounded-xl shrink-0">
        <div>
            <h1 class="text-sm md:text-base font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-violet-400">
                Minkowski Spacetime Lab
            </h1>
        </div>
        <!-- Quick Telemetry Badges -->
        <div class="flex gap-3 font-mono text-xs">
            <span class="text-slate-400">γ: <strong id="gammaBadge" class="text-cyan-400">1.25</strong></span>
            <span class="text-slate-400">U·A: <strong id="orthoBadge" class="text-emerald-400">0.00</strong></span>
        </div>
    </header>

    <!-- Dual Canvas Viewports with Floating Glassmorphism HUD Controls -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 flex-grow my-2 min-h-0">
        
        <!-- Laboratory Frame S -->
        <div class="relative bg-cardBg/90 border border-borderCol rounded-2xl p-2 shadow-xl flex flex-col items-center justify-center overflow-hidden min-h-0">
            <div class="absolute top-3 left-4 z-10 bg-slate-900/80 px-2 py-0.5 rounded text-xs font-semibold text-slate-300 border border-slate-800">
                Laboratory Frame \(S\)
            </div>
            <div class="relative w-full h-full flex items-center justify-center">
                <canvas id="labCanvas" class="max-w-full max-h-full aspect-square"></canvas>
            </div>
        </div>

        <!-- Boosted Frame S' -->
        <div class="relative bg-cardBg/90 border border-borderCol rounded-2xl p-2 shadow-xl flex flex-col items-center justify-center overflow-hidden min-h-0">
            <div class="absolute top-3 left-4 z-10 bg-slate-900/80 px-2 py-0.5 rounded text-xs font-semibold text-slate-300 border border-slate-800">
                Boosted Frame \(S'\) (\(\beta = v/c\))
            </div>
            <div class="relative w-full h-full flex items-center justify-center">
                <canvas id="boostedCanvas" class="max-w-full max-h-full aspect-square"></canvas>
            </div>
        </div>

    </div>

    <!-- Floating Glassmorphism HUD Controls Dashboard -->
    <div class="bg-cardBg/85 border border-borderCol rounded-2xl p-3 md:p-4 shadow-2xl backdrop-blur-xl shrink-0 grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Velocity Slider -->
        <div class="space-y-1">
            <div class="flex justify-between items-center text-xs">
                <span class="font-medium text-slate-300">Velocity (\(\beta = v/c\)):</span>
                <span id="betaVal" class="font-mono text-cyan-400 font-semibold">0.60</span>
            </div>
            <input id="betaRange" type="range" min="-0.95" max="0.95" step="0.01" value="0.60" class="w-full h-1.5 bg-slate-800 rounded-lg cursor-pointer">
        </div>

        <!-- Proper Acceleration Slider -->
        <div class="space-y-1">
            <div class="flex justify-between items-center text-xs">
                <span class="font-medium text-slate-300">Proper Acceleration (\(g\)):</span>
                <span id="gVal" class="font-mono text-pink-400 font-semibold">0.50</span>
            </div>
            <input id="gRange" type="range" min="0.1" max="2.0" step="0.05" value="0.50" class="w-full h-1.5 bg-slate-800 rounded-lg cursor-pointer">
        </div>

        <!-- Coordinate Time Slider -->
        <div class="space-y-1">
            <div class="flex justify-between items-center text-xs">
                <span class="font-medium text-slate-300">Coordinate Time (\(ct\)):</span>
                <span id="tVal" class="font-mono text-amber-400 font-semibold">0.00</span>
            </div>
            <input id="tRange" type="range" min="-5.0" max="5.0" step="0.05" value="0.00" class="w-full h-1.5 bg-slate-800 rounded-lg cursor-pointer">
        </div>
    </div>

    <!-- Simulator Engine Script -->
    <script>
        const labCanvas = document.getElementById('labCanvas');
        const boostedCanvas = document.getElementById('boostedCanvas');
        const labCtx = labCanvas.getContext('2d');
        const boostedCtx = boostedCanvas.getContext('2d');

        const betaRange = document.getElementById('betaRange');
        const gRange = document.getElementById('gRange');
        const tRange = document.getElementById('tRange');

        const betaVal = document.getElementById('betaVal');
        const gVal = document.getElementById('gVal');
        const tVal = document.getElementById('tVal');

        const gammaBadge = document.getElementById('gammaBadge');
        const orthoBadge = document.getElementById('orthoBadge');

        function resizeCanvases() {
            [labCanvas, boostedCanvas].forEach(canvas => {
                const parent = canvas.parentElement;
                const size = Math.min(parent.clientWidth, parent.clientHeight);
                canvas.width = size * window.devicePixelRatio;
                canvas.height = size * window.devicePixelRatio;
                canvas.style.width = `${size}px`;
                canvas.style.height = `${size}px`;
            });
            draw();
        }

        window.addEventListener('resize', resizeCanvases);

        function drawGrid(ctx, width, height, scale, originX, originY) {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            
            for (let x = originX % (scale * 0.5); x < width; x += scale * 0.5) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = originY % (scale * 0.5); y < height; y += scale * 0.5) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function drawAxisLabel(ctx, text, x, y, color = '#94a3b8') {
            ctx.fillStyle = color;
            ctx.font = '10px system-ui, sans-serif';
            ctx.fillText(text, x, y);
        }

        function draw() {
            const beta = parseFloat(betaRange.value);
            const g = parseFloat(gRange.value);
            const t = parseFloat(tRange.value);

            betaVal.textContent = beta.toFixed(2);
            gVal.textContent = g.toFixed(2);
            tVal.textContent = t.toFixed(2);

            const gamma = 1.0 / Math.sqrt(Math.max(0.001, 1 - beta * beta));
            const rho = 1.0 / g;

            const U0 = gamma;
            const U1 = gamma * beta;
            const A0 = Math.pow(gamma, 4) * beta * g;
            const A1 = Math.pow(gamma, 4) * g;
            const dotProduct = -U0 * A0 + U1 * A1;

            gammaBadge.textContent = gamma.toFixed(2);
            orthoBadge.textContent = dotProduct.toFixed(2);

            renderLab(labCtx, labCanvas.width, labCanvas.height, beta, g, t, rho);
            renderBoosted(boostedCtx, boostedCanvas.width, boostedCanvas.height, beta, g, t, rho);
        }

        function renderLab(ctx, width, height, beta, g, t, rho) {
            ctx.clearRect(0, 0, width, height);
            const scale = width / 12;
            const originX = width / 2;
            const originY = height / 2;

            drawGrid(ctx, width, height, scale, originX, originY);

            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, originY); ctx.lineTo(width, originY);
            ctx.moveTo(originX, 0); ctx.lineTo(originX, height);
            ctx.stroke();

            drawAxisLabel(ctx, 'ct', originX + 6, 14);
            drawAxisLabel(ctx, 'x', width - 16, originY - 6);

            // Dashed Yellow Light Cones
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(originX - originX, originY - originX);
            ctx.lineTo(originX + originX, originY + originX);
            ctx.moveTo(originX - originX, originY + originX);
            ctx.lineTo(originX + originX, originY - originX);
            ctx.stroke();
            ctx.setLineDash([]);

            // Event Horizon: x = ct - rho
            ctx.strokeStyle = '#ec4899';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            for (let px = 0; px <= width; px += 5) {
                const xVal = (px - originX) / scale;
                const ctVal = xVal + rho;
                const py = originY - ctVal * scale;
                if (px === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // Extended Rindler Hyperbola
            ctx.strokeStyle = '#ec4899';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            let first = true;
            for (let py = 0; py <= height; py += 2) {
                const ctVal = (originY - py) / scale;
                const xVal = Math.sqrt(rho * rho + ctVal * ctVal);
                const px = originX + xVal * scale;
                if (first) { ctx.moveTo(px, py); first = false; }
                else { ctx.lineTo(px, py); }
            }
            ctx.stroke();

            // Particle Position Dot
            const currentCt = t;
            const currentX = Math.sqrt(rho * rho + currentCt * currentCt);
            const dotPx = originX + currentX * scale;
            const dotPy = originY - currentCt * scale;

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(dotPx, dotPy, 5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Legend at Bottom-Left
            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(8, height - 75, 175, 68);
            ctx.strokeStyle = '#334155';
            ctx.strokeRect(8, height - 75, 175, 68);

            drawAxisLabel(ctx, '⚡ Light cones: x = ±ct', 14, height - 55, '#eab308');
            drawAxisLabel(ctx, '── Rindler Worldline', 14, height - 37, '#ec4899');
            drawAxisLabel(ctx, '- - Event horizon: x = ct - ρ', 14, height - 19, '#ec4899');
        }

        function renderBoosted(ctx, width, height, beta, g, t, rho) {
            ctx.clearRect(0, 0, width, height);
            const scale = width / 12;
            const originX = width / 2;
            const originY = height / 2;

            drawGrid(ctx, width, height, scale, originX, originY);

            const gamma = 1.0 / Math.sqrt(Math.max(0.001, 1 - beta * beta));
            const angle = Math.atan(beta);

            ctx.lineWidth = 2;
            
            // ct' axis
            ctx.strokeStyle = '#06b6d4';
            ctx.beginPath();
            ctx.moveTo(originX - Math.sin(angle) * width, originY + Math.cos(angle) * height);
            ctx.lineTo(originX + Math.sin(angle) * width, originY - Math.cos(angle) * height);
            ctx.stroke();

            // x' axis
            ctx.strokeStyle = '#8b5cf6';
            ctx.beginPath();
            ctx.moveTo(originX - Math.cos(angle) * width, originY + Math.sin(angle) * height);
            ctx.lineTo(originX + Math.cos(angle) * width, originY - Math.sin(angle) * height);
            ctx.stroke();

            drawAxisLabel(ctx, "ct'", originX + Math.sin(angle) * (originY - 20) + 6, originY - Math.cos(angle) * (originY - 20), '#06b6d4');
            drawAxisLabel(ctx, "x'", width - 30, originY - Math.sin(angle) * (originX - 20) - 6, '#8b5cf6');

            // Dashed Yellow Light Cones
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(originX - originX, originY - originX);
            ctx.lineTo(originX + originX, originY + originX);
            ctx.moveTo(originX - originX, originY + originX);
            ctx.lineTo(originX + originX, originY - originX);
            ctx.stroke();
            ctx.setLineDash([]);

            // Boosted Hyperbola
            ctx.strokeStyle = '#ec4899';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            let first = true;
            for (let tau = -4; tau <= 4; tau += 0.05) {
                const X_r = rho * Math.cosh(g * tau);
                const T_r = rho * Math.sinh(g * tau);
                
                const lab_t = T_r;
                const lab_x = X_r;
                const boosted_t = gamma * (lab_t - beta * lab_x);
                const boosted_x = gamma * (lab_x - beta * lab_t);

                const px = originX + boosted_x * scale;
                const py = originY - boosted_t * scale;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    if (first) { ctx.moveTo(px, py); first = false; }
                    else { ctx.lineTo(px, py); }
                } else {
                    first = true;
                }
            }
            ctx.stroke();

            // Legend at Bottom-Left
            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(8, height - 55, 160, 48);
            ctx.strokeStyle = '#334155';
            ctx.strokeRect(8, height - 55, 160, 48);

            drawAxisLabel(ctx, '— Boosted ct\' Axis', 14, height - 37, '#06b6d4');
            drawAxisLabel(ctx, '— Boosted x\' Axis', 14, height - 19, '#8b5cf6');
        }

        [betaRange, gRange, tRange].forEach(input => {
            input.addEventListener('input', draw);
        });

        resizeCanvases();
    </script>
</body>
</html>
